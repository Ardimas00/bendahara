<!-- Mobile Bottom Tab Bar (for all pages) -->
<nav id="bottom-tab" class="fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-slate-200 shadow-t flex justify-between items-center px-2 py-1 sm:hidden">
