{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl mx-auto py-6">
    <div class="bg-white p-8 rounded-xl shadow-lg">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Edit Transaksi</h1>
            <a href="{{ url_for('main.view_transaction', id=transaction._id) }}" class="text-sm font-medium text-sky-600 hover:text-sky-500">&larr; Kembali ke Detail</a>
        </div>

        <form action="{{ url_for('main.edit_transaction', id=transaction._id) }}" method="post">
            {% include '_csrf.html' %}
            <div class="grid grid-cols-1 gap-6">
                <div>
                    <label for="tanggal" class="block text-sm font-medium text-slate-700">Tanggal</label>
                    <input type="date" name="tanggal" id="tanggal" value="{{ transaction.tanggal.strftime('%Y-%m-%d') }}" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-sky-300 focus:ring focus:ring-sky-200 focus:ring-opacity-50">
                </div>

                <div>
                    <label for="deskripsi" class="block text-sm font-medium text-slate-700">Deskripsi</label>
                    <input type="text" name="deskripsi" id="deskripsi" value="{{ transaction.deskripsi }}" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-sky-300 focus:ring focus:ring-sky-200 focus:ring-opacity-50">
                </div>

                <div>
                    <label for="jumlah" class="block text-sm font-medium text-slate-700">Jumlah (Rp)</label>
                    <input type="text" name="jumlah" id="jumlah" value="{{ transaction.jumlah }}" required class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-sky-300 focus:ring focus:ring-sky-200 focus:ring-opacity-50">
                </div>

                <div>
                    <label for="kategori" class="block text-sm font-medium text-slate-700">Kategori</label>
                    <select name="kategori" id="kategori" class="mt-1 block w-full rounded-md border-slate-300 shadow-sm focus:border-sky-300 focus:ring focus:ring-sky-200 focus:ring-opacity-50">
                        <option value="Pemasukan" {% if transaction.kategori == 'Pemasukan' %}selected{% endif %}>Pemasukan</option>
                        <option value="Pengeluaran" {% if transaction.kategori == 'Pengeluaran' %}selected{% endif %}>Pengeluaran</option>
                    </select>
                </div>
            </div>

            <div class="mt-8 pt-5 border-t border-slate-200">
                <div class="flex justify-end">
                    <a href="{{ url_for('main.view_transaction', id=transaction._id) }}" class="inline-flex justify-center py-2 px-4 border border-slate-300 rounded-md shadow-sm text-sm font-medium text-slate-700 bg-white hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500">
                        Batal
                    </a>
                    <button type="submit" class="ml-3 inline-flex justify-center py-2 px-4 border border-sky-600 rounded-md shadow-sm text-sm font-medium text-sky-700 bg-white hover:bg-sky-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500">
                        Simpan Perubahan
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
