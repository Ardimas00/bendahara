{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto py-12">
    <h1 class="text-2xl font-bold text-slate-800 mb-6 text-center">Pilih atau Buat Pencatatan (Acara)</h1>
    
    <!-- Pilih Acara dengan Dropdown -->
    {% if acara_list %}
    <div class="bg-white p-6 rounded-xl shadow mb-6">
        <h2 class="text-lg font-semibold mb-4 text-slate-800">Kelola Acara</h2>
        <div class="mb-4">
            <label for="acara_id" class="block text-sm font-medium text-slate-600 mb-2">Pilih Acara</label>
            <select id="acara_id" name="acara_id" required class="w-full rounded-md border-slate-300 shadow-sm focus:border-sky-300 focus:ring focus:ring-sky-200 focus:ring-opacity-50">
                <option value="" disabled selected>Pilih acara...</option>
                {% for a in acara_list %}
                <option value="{{ a._id }}">{{ a.nama }}{% if a.keterangan %} - {{ a.keterangan }}{% endif %}</option>
                {% endfor %}
            </select>
        </div>
        <div style="display: flex; gap: 8px;">
            <form method="post" action="{{ url_for('main.select_acara') }}" style="flex: 1;">
                <input type="hidden" id="select_acara_id" name="acara_id" value="">
                <button type="submit" style="width: 100%; padding: 12px 16px; background-color: #0284c7; color: white; font-size: 16px; font-weight: 600; border-radius: 6px; border: none; cursor: pointer;" onmouseover="this.style.backgroundColor='#0369a1'" onmouseout="this.style.backgroundColor='#0284c7'">Pilih</button>
            </form>
            <form method="post" action="{{ url_for('main.delete_acara') }}" style="flex: 1;" onsubmit="return confirm('Yakin ingin menghapus acara yang dipilih?')">
                <input type="hidden" id="delete_acara_id" name="acara_id" value="">
                <button type="submit" style="width: 100%; padding: 12px 16px; background-color: #dc2626; color: white; font-size: 16px; font-weight: 600; border-radius: 6px; border: none; cursor: pointer;" onmouseover="this.style.backgroundColor='#b91c1c'" onmouseout="this.style.backgroundColor='#dc2626'">Hapus</button>
            </form>
        </div>
    </div>
    {% endif %}
    
    <!-- Form Buat Acara Baru -->
    <div class="bg-white p-6 rounded-xl shadow">
        <h2 class="text-lg font-semibold mb-4 text-slate-800">Buat Acara Baru</h2>
        <form method="post" action="{{ url_for('main.create_acara') }}">
            <div class="mb-4">
                <label for="nama" class="block text-sm font-medium text-slate-600 mb-2">Nama Acara/Pencatatan</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama acara" required class="w-full rounded-md border-slate-300 shadow-sm focus:border-sky-300 focus:ring focus:ring-sky-200 focus:ring-opacity-50">
            </div>
            <div class="mb-4">
                <label for="keterangan" class="block text-sm font-medium text-slate-600 mb-2">Keterangan (Opsional)</label>
                <textarea id="keterangan" name="keterangan" placeholder="Deskripsi atau catatan tambahan" rows="3" class="w-full rounded-md border-slate-300 shadow-sm focus:border-sky-300 focus:ring focus:ring-sky-200 focus:ring-opacity-50"></textarea>
            </div>
            <button type="submit" style="width: 100%; padding: 12px 16px; background-color: #059669; color: white; font-size: 16px; font-weight: 600; border-radius: 6px; border: none; cursor: pointer;" onmouseover="this.style.backgroundColor='#047857'" onmouseout="this.style.backgroundColor='#059669'">Simpan Acara Baru</button>
        </form>
    </div>
</div>

<script>
// Sinkronisasi nilai dropdown dengan hidden input
document.getElementById('acara_id').addEventListener('change', function() {
    var selectedValue = this.value;
    document.getElementById('select_acara_id').value = selectedValue;
    document.getElementById('delete_acara_id').value = selectedValue;
});
</script>
{% endblock %}
